name: Apply compatibility fixes
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'modernize/python3-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/python3-core
          fetch-depth: 1
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scc/actions.py')
          s = p.read_text()
          old = '''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to string """\n\t\treturn (" " * pad) + "%s(%s)" % (self.COMMAND, ", ".join([\n\t\t\tx.to_string() if isinstance(x, Action) else str(x)\n\t\t\tfor x in self.parameters\n\t\t]))'''
          new = '''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to its canonical parser representation. """\n\t\treturn (" " * pad) + "%s(%s)" % (\n\t\t\tself.COMMAND, ", ".join(Action.encode_parameters(self.parameters))\n\t\t)'''
          if old in s:
              s = s.replace(old, new, 1)
          old = '''\t\tif type(parameter) in (str, unicode):\n\t\t\treturn "'%s'" % (str(parameter).encode('string_escape'),)'''
          new = '''\t\tif type(parameter) in (str, unicode):\n\t\t\tescaped = str(parameter).encode('unicode_escape').decode('ascii')\n\t\t\treturn "'%s'" % (escaped,)'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('setup.py')
          s = p.read_text()
          if 'if __name__ == "__main__":' not in s:
              pos = s.find('setup(\n')
              if pos >= 0:
                  prefix, rest = s[:pos], s[pos:]
                  rest = ''.join(('\t' + line if line.strip() else line) for line in rest.splitlines(True))
                  s = prefix + 'if __name__ == "__main__":\n' + rest
                  p.write_text(s)

          p = Path('glade/app.glade')
          s = p.read_text()
          counter = 0
          def add_id(m):
              nonlocal counter
              tag = m.group(0)
              if re.search(r'\bid\s*=', tag):
                  return tag
              counter += 1
              return tag[:-1] + f' id="autoWidget{counter}">' 
          p.write_text(re.sub(r'<object\s+class="[^"]+"[^>]*>', add_id, s))
          PY
      - name: Verify
        run: python -m pytest tests
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scc/actions.py setup.py glade/app.glade
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: complete Python 3 compatibility test fixes'
          git push origin HEAD:modernize/python3-core
