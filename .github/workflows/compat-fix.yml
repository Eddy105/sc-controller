name: Temporary compatibility fixes
on:
  push:
    branches: [modernize/python3-core]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/python3-core
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scc/actions.py')
          s = p.read_text()
          s = s.replace('''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to string """\n\t\treturn (" " * pad) + "%s(%s)" % (self.COMMAND, ", ".join([\n\t\t\tx.to_string() if isinstance(x, Action) else str(x)\n\t\t\tfor x in self.parameters\n\t\t]))''','''\tdef to_string(self, multiline=False, pad=0):\n\t\t"""Converts action back to its canonical parser representation."""\n\t\treturn (" " * pad) + "%s(%s)" % (\n\t\t\tself.COMMAND, ", ".join(Action.encode_parameters(self.parameters))\n\t\t)''')
          s = s.replace('''\t\tif parameter in PARSER_CONSTANTS:\n\t\t\treturn parameter\n\t\tif type(parameter) in (str, unicode):\n\t\t\treturn "'%s'" % (str(parameter).encode('string_escape'),)\n\t\treturn nameof(parameter)''','''\t\tif parameter in PARSER_CONSTANTS:\n\t\t\treturn str(parameter)\n\t\tif type(parameter) in (str, unicode):\n\t\t\tescaped = str(parameter).encode("unicode_escape").decode("ascii")\n\t\t\treturn "'%s'" % (escaped,)\n\t\treturn nameof(parameter)''')
          p.write_text(s)

          for p in Path('glade').rglob('*.glade'):
              s = p.read_text()
              counter = [0]
              def add_id(m):
                  tag = m.group(0)
                  if re.search(r'\bid\s*=', tag):
                      return tag
                  counter[0] += 1
                  return tag[:-1] + f' id="autoWidget_{counter[0]}">' 
              ns = re.sub(r'<object\s+class="[^"]+"[^>]*>', add_id, s)
              if ns != s:
                  p.write_text(ns)
          PY
      - name: Verify
        run: python -m pytest tests
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/compat-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scc/actions.py glade .github/workflows/compat-fix.yml
          git diff --cached --quiet || git commit -m 'fix: restore canonical action serialization and glade ids'
          git push origin HEAD:modernize/python3-core
