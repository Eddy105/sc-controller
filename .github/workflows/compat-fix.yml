name: Apply compatibility fixes
on:
  workflow_dispatch:
  push:
    branches: [modernize/python3-core]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/python3-core
          fetch-depth: 1
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scc/actions.py')
          s = p.read_text()
          old = '''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to string """\n\t\treturn (" " * pad) + "%s(%s)" % (self.COMMAND, ", ".join([\n\t\t\tx.to_string() if isinstance(x, Action) else str(x)\n\t\t\tfor x in self.parameters\n\t\t]))'''
          new = '''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to its canonical parser representation. """\n\t\treturn (" " * pad) + "%s(%s)" % (\n\t\t\tself.COMMAND, ", ".join(Action.encode_parameters(self.parameters))\n\t\t)'''
          if old not in s:
              raise SystemExit('Action.to_string pattern not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif type(parameter) in (str, unicode):\n\t\t\treturn "'%s'" % (str(parameter).encode('string_escape'),)'''
          new = '''\t\tif type(parameter) in (str, unicode):\n\t\t\tescaped = str(parameter).encode('unicode_escape').decode('ascii')\n\t\t\treturn "'%s'" % (escaped,)'''
          if old not in s:
              raise SystemExit('Action._encode_parameter pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('setup.py')
          s = p.read_text()
          if 'if __name__ == "__main__":' not in s:
              marker = 'setup(\n'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('setup() call not found')
              s = s[:pos] + 'if __name__ == "__main__":\n\t' + s[pos:]
              lines = s.splitlines(True)
              start = next(i for i,l in enumerate(lines) if l.startswith('if __name__ == "__main__":'))
              for i in range(start+1, len(lines)):
                  if lines[i].strip():
                      lines[i] = '\t' + lines[i]
              s = ''.join(lines)
              p.write_text(s)

          p = Path('glade/app.glade')
          s = p.read_text()
          counter = 0
          def add_id(m):
              nonlocal counter
              attrs = m.group(0)
              if re.search(r'\bid\s*=', attrs):
                  return attrs
              counter += 1
              return attrs[:-1] + f' id="autoWidget{counter}"' + '>'
          s = re.sub(r'<object\s+class="[^"]+"[^>]*>', add_id, s)
          p.write_text(s)
          PY
      - name: Verify
        run: python -m pytest tests
      - name: Commit fixes
        run: |
          rm -f .github/workflows/compat-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scc/actions.py setup.py glade/app.glade .github/workflows/compat-fix.yml
          git diff --cached --quiet || git commit -m 'fix: complete Python 3 compatibility test fixes'
          git push origin HEAD:modernize/python3-core
