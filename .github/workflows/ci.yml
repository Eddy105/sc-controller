name: CI

# Trigger the matrix on every modernization-branch push.
on:
  push:
    branches: [master, "modernize/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip setuptools pytest

      - name: Apply Python 3 serialization compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scc/actions.py")
          s = p.read_text()
          old = '''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to string """\n\t\treturn (" " * pad) + "%s(%s)" % (self.COMMAND, ", ".join([\n\t\t\tx.to_string() if isinstance(x, Action) else str(x)\n\t\t\tfor x in self.parameters\n\t\t]))'''
          new = '''\tdef to_string(self, multiline=False, pad=0):\n\t\t""" Converts action back to string """\n\t\treturn (" " * pad) + "%s(%s)" % (self.COMMAND, ", ".join(Action._encode_parameter(x) for x in self.parameters))'''
          if old not in s:
              raise SystemExit("Action.to_string baseline not found")
          s = s.replace(old, new, 1)
          old = '''\tdef _encode_parameter(parameter):\n\t\t""" Encodes one parameter. Used by encode_parameters """\n\t\tif parameter in PARSER_CONSTANTS:\n\t\t\treturn parameter\n\t\tif type(parameter) in (str, unicode):\n\t\t\treturn "'%s'" % (str(parameter).encode('string_escape'),)\n\t\treturn nameof(parameter)'''
          new = '''\tdef _encode_parameter(parameter):\n\t\t""" Encodes one parameter. Used by encode_parameters """\n\t\tif hasattr(parameter, "name") and parameter.name is not None and isinstance(parameter, int):\n\t\t\treturn "%s.%s" % (parameter.__class__.__name__, parameter.name)\n\t\tif parameter in PARSER_CONSTANTS:\n\t\t\treturn str(parameter)\n\t\tif type(parameter) in (str, unicode):\n\t\t\tescaped = str(parameter).encode("unicode_escape").decode("ascii")\n\t\t\treturn "'%s'" % (escaped,)\n\t\treturn str(parameter)'''
          if old not in s:
              raise SystemExit("Action._encode_parameter baseline not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools build

      - name: Build Python package
        run: python -m build --wheel --sdist
