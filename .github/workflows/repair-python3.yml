name: Repair Python 3 compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/python3-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("scc/actions.py")
          s = p.read_text()
          old = '''        if parameter in PARSER_CONSTANTS:\n            return parameter\n        if type(parameter) in (str, unicode):\n            return "%s" % (str(parameter).encode('string_escape'),)\n        return nameof(parameter)'''
          new = '''        if parameter in PARSER_CONSTANTS:\n            return parameter\n        if isinstance(parameter, str):\n            return repr(parameter)\n        return nameof(parameter)'''
          if old in s:
              s = s.replace(old, new)
          else:
              s = re.sub(r"        if parameter in PARSER_CONSTANTS:\\n            return parameter\\n        if type\(parameter\) in \(str, unicode\):\\n            return .*?\\n        return nameof\(parameter\)", new, s, count=1)
          p.write_text(s)

          p = Path("scc/special_actions.py")
          s = p.read_text()
          s = s.replace("self.profile.encode('utf-8').encode('string_escape')", "self.profile")
          s = s.replace("self.parameters[0].encode('unicode_escape')", "repr(self.parameters[0])[1:-1]")
          s = s.replace("self.text.encode('string_escape')", "self.text")
          p.write_text(s)

          p = Path(".github/workflows/ci.yml")
          s = p.read_text()
          s = s.replace("python -m pip install --upgrade pip pytest", "python -m pip install --upgrade pip setuptools pytest")
          p.write_text(s)

          p = Path("glade/app.glade")
          s = p.read_text()
          marker = '<object class="GtkMenuButton" id="btDaemon">'
          start = s.find(marker)
          if start >= 0:
              child = s.find('<child>', start)
              box = s.find('<object class="GtkBox">', child)
              if child >= 0 and box >= 0 and box < s.find('</child>', child):
                  s = s[:box] + '<object class="GtkBox" id="boxDaemonMenu">' + s[box + len('<object class="GtkBox">'):]
          p.write_text(s)
          PY

      - name: Verify tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests

      - name: Commit repaired tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scc/actions.py scc/special_actions.py glade/app.glade .github/workflows/ci.yml
          git diff --cached --quiet || git commit -m "fix: finish Python 3 compatibility test fixes"
          git push origin HEAD:modernize/python3-core
